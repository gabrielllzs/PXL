<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="320" height="320">
    <defs>
        <style>
            :root {
            --outer-color: #f5b764;
            --shadow-color: #d99b50;
            }
            .outer { fill: var(--outer-color); }
            .shadow { fill: var(--shadow-color); }
            .minus { fill: black; }   /* red minus */
            .plus { fill: white; } /* blue plus */
        </style>
    </defs>


    <!-- Minus -->
    <g class="spacer" transform="translate(0.5,0)" fill="#1c1c1c">
        <rect x="5" y="7" width="6" height="1"/>
    </g>

    <g class="minus">
        <rect x="5" y="7" width="6" height="1"/>
    </g>

</svg>
