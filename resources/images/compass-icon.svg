<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="320" height="320">
    <defs>
        <style>
            :root {
            --outer-color: black;
            --shadow-color: #1c1c1c;
            }
            .outer { fill: var(--outer-color); }
            .shadow { fill: var(--shadow-color); }
            .north { fill: #f00; }
            .center { fill: #0096FF; }
        </style>
    </defs>

    <!-- Shadow group -->
    <g class="shadow" transform="translate(0.5,0)">
        <rect x="6" y="2" width="4" height="1"/>
        <rect x="4" y="3" width="2" height="1"/>
        <rect x="10" y="3" width="2" height="1"/>
        <rect x="3" y="4" width="1" height="1"/>
        <rect x="12" y="4" width="1" height="1"/>
        <rect x="2" y="5" width="1" height="6"/>
        <rect x="13" y="5" width="1" height="6"/>
        <rect x="3" y="11" width="1" height="1"/>
        <rect x="12" y="11" width="1" height="1"/>
        <rect x="4" y="12" width="2" height="1"/>
        <rect x="10" y="12" width="2" height="1"/>
        <rect x="6" y="13" width="4" height="1"/>
    </g>

    <!-- Outer group -->
    <g class="outer">
        <rect x="6" y="2" width="4" height="1"/>
        <rect x="4" y="3" width="2" height="1"/>
        <rect x="10" y="3" width="2" height="1"/>
        <rect x="3" y="4" width="1" height="1"/>
        <rect x="12" y="4" width="1" height="1"/>
        <rect x="2" y="5" width="1" height="6"/>
        <rect x="13" y="5" width="1" height="6"/>
        <rect x="3" y="11" width="1" height="1"/>
        <rect x="12" y="11" width="1" height="1"/>
        <rect x="4" y="12" width="2" height="1"/>
        <rect x="10" y="12" width="2" height="1"/>
        <rect x="6" y="13" width="4" height="1"/>
    </g>

    <!-- North needle (thinner) -->
    <g transform="translate(0.5,0)" fill="#c20000">
        <rect x="7.75" y="4" width="0.5" height="1"/>
        <rect x="7.5" y="5" width="1" height="1"/>
        <rect x="7.25" y="6" width="1.5" height="1"/>
        <rect x="7" y="7" width="2" height="1"/>
    </g>

    <rect class="north" x="7.75" y="4" width="0.5" height="1"/>
    <rect class="north" x="7.5" y="5" width="1" height="1"/>
    <rect class="north" x="7.25" y="6" width="1.5" height="1"/>
    <rect class="north" x="7" y="7" width="2" height="1"/>

    <!-- South needle (thinner) -->
    <g transform="translate(0.5,0)" fill="#0061a6">
        <rect x="7.75" y="11" width="0.5" height="1"/>
        <rect x="7.5" y="10" width="1" height="1"/>
        <rect x="7.25" y="9" width="1.5" height="1"/>
        <rect x="7" y="8" width="2" height="1"/>
    </g>

    <rect class="center" x="7.75" y="11" width="0.5" height="1"/>
    <rect class="center" x="7.5" y="10" width="1" height="1"/>
    <rect class="center" x="7.25" y="9" width="1.5" height="1"/>
    <rect class="center" x="7" y="8" width="2" height="1"/>
</svg>
