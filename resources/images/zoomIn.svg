<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="320" height="320">
    <defs>
        <style>
            :root {
            --outer-color: #black;
            --shadow-color: #2b2b2b;
            }
            .outer { fill: var(--outer-color); }
            .shadow { fill: var(--shadow-color); }
            .minus { fill: #f00; }   /* red minus */
            .plus { fill: white; } /* blue plus */
        </style>
    </defs>

    <!-- Shadow group -->


    <g transform="translate(0.5,0)" fill="grey">
        <rect x="7.5" y="5" width="1" height="6"/>
        <rect x="5" y="7.5" width="6" height="1"/>
    </g>

    <!-- Plus -->
    <g class="plus">
        <rect x="7.5" y="5" width="1" height="6"/>
        <rect x="5" y="7.5" width="6" height="1"/>
    </g>
</svg>
